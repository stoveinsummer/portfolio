name: Import sanitized source once

on:
  push:
    branches: [main]
    paths:
      - juhwan-source-github.tar.gz

permissions:
  contents: write

jobs:
  import-source:
    if: github.event.head_commit.message == 'Upload sanitized source archive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          tar -xzf juhwan-source-github.tar.gz -C "$stage"
          git tag -f legacy-pages-2026-09-30 01ac92c53577607c1773e3d7852de48c487aba33
          git rm -r .
          cp -a "$stage"/. .
          git add -A
          git config user.name "stoveinsummer"
          git config user.email "wnlth96@gmail.com"
          git commit -m "Replace static portfolio with personal workspace source"
          git push origin HEAD:main
          git push origin refs/tags/legacy-pages-2026-09-30
